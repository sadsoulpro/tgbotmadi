<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10202b">
    <meta name="description" content="Мади Рахман — психолог-наставник. Бесплатная самодиагностика и личный разбор.">
    <link rel="canonical" href="https://bio.madirahman.com/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:url" content="https://bio.madirahman.com/">
    <meta property="og:title" content="Мади Рахман | Психолог-наставник">
    <meta property="og:description" content="Бесплатная самодиагностика и личный разбор.">
    <meta property="og:image" content="https://bio.madirahman.com/avatar.png">
    <title>Мади Рахман | Психолог-наставник</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        background: #10202b;
      }

      * { box-sizing: border-box; }

      html { min-height: 100%; }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        background:
          radial-gradient(ellipse 460px 410px at 50% 7%, rgba(179, 157, 132, .19), transparent 72%),
          radial-gradient(ellipse 540px 500px at 0% 100%, rgba(54, 91, 106, .24), transparent 72%),
          linear-gradient(165deg, #142631 0%, #0c1821 100%);
        color: #f6f2ec;
      }

      main {
        width: min(100% - 40px, 520px);
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0 auto;
        padding: max(68px, 10vh) 0 max(48px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .avatar {
        width: 132px;
        height: 132px;
        display: block;
        object-fit: cover;
        object-position: center 29%;
        border-radius: 50%;
        border: 3px solid rgba(239, 226, 210, .78);
        box-shadow: 0 0 0 8px rgba(255, 255, 255, .045), 0 22px 52px rgba(0, 0, 0, .28);
      }

      h1 {
        max-width: 460px;
        margin: 32px 0 50px;
        font-size: clamp(28px, 6.2vw, 37px);
        line-height: 1.18;
        letter-spacing: -.035em;
        font-weight: 650;
        text-align: center;
        text-wrap: balance;
      }

      nav {
        width: 100%;
        display: grid;
        gap: 16px;
      }

      .action {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        min-height: 112px;
        padding: 23px 24px;
        border: 1px solid transparent;
        border-radius: 22px;
        text-decoration: none;
        transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      }

      .action:hover { transform: translateY(-3px); }
      .action:active { transform: translateY(0); }
      .action:focus-visible { outline: 3px solid #c9af8e; outline-offset: 4px; }

      .action:first-child {
        background: #efe4d5;
        color: #1b2b34;
        box-shadow: 0 16px 36px rgba(0, 0, 0, .18);
      }

      .action:first-child:hover { box-shadow: 0 21px 42px rgba(0, 0, 0, .26); }

      .action:last-child {
        background: rgba(255, 255, 255, .055);
        border-color: rgba(239, 228, 213, .33);
        color: #f6f2ec;
      }

      .action:last-child:hover { border-color: rgba(239, 228, 213, .7); }

      .action-copy { display: grid; gap: 8px; }

      .action strong {
        font-size: clamp(19px, 4.6vw, 23px);
        line-height: 1.25;
        letter-spacing: -.02em;
        font-weight: 650;
      }

      .action small {
        max-width: 370px;
        font-size: 14px;
        line-height: 1.48;
        font-weight: 400;
      }

      .action:first-child small { color: #52616a; }
      .action:last-child small { color: #c3cbd0; }

      .arrow {
        flex: 0 0 auto;
        width: 25px;
        height: 25px;
        opacity: .8;
      }

      @media (max-width: 420px) {
        main { width: min(100% - 32px, 520px); padding-top: max(58px, 9vh); }
        h1 { margin: 30px 0 44px; }
        .action { padding: 21px 19px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .action { transition: none; }
        .action:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="avatar" src="./avatar.png" width="132" height="132" alt="Мади Рахман">
      <h1>Мади Рахман | Психолог-наставник</h1>
      <nav aria-label="Выберите действие">
        <a class="action" href="https://t.me/madirhmnbot">
          <span class="action-copy">
            <strong>Бесплатная самодиагностика</strong>
            <small>15 минут, увидишь, где утекает ресурс</small>
          </span>
          <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h14m-6-6 6 6-6 6"/></svg>
        </a>
        <a class="action" href="https://madirahman.com/razbor">
          <span class="action-copy">
            <strong>Личный разбор</strong>
            <small>1,5 часа лично со мной, для тех, кто готов разобрать свою ситуацию глубоко</small>
          </span>
          <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h14m-6-6 6 6-6 6"/></svg>
        </a>
      </nav>
    </main>
  </body>
</html>
